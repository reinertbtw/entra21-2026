<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Clientes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Clientes</h1>

        <input type="text" id="nome" placeholder="Nome">

        <input type="email" id="email" placeholder="Email">

        <input type="text" id="telefone" placeholder="Telefone">

        <input type="text" id="cep" placeholder="CEP" onblur="buscarLogradouro()">

        <input type="text" id="estado" placeholder="Estado" readonly>

        <input type="text" id="cidade" placeholder="Cidade" readonly>

        <input type="text" id="rua" placeholder="Rua" readonly>


        <button id="cadastrar" class="cadastrar">
            Cadastrar
        </button>

        <a href="clientes.html">
            <button class="ver-clientes">
                Ver Clientes
            </button>
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
